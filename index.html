<!doctype html>
<html lang="es">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return protoFetch;
                },
                set: function(fn) {
                  protoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {
            console.warn('Fetch setter patch error:', err);
          }
        }
      })();
    </script>
